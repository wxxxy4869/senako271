<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senako's Blog</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s ease, opacity 0.3s ease; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #333; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
        #bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: -1; transition: opacity 0.5s ease; }
        :root { --theme-color: #7DA1DE; }

        /* 1. 初始密码页 */
        #landing-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); }
        .landing-avatar { width: 120px; height: 120px; object-fit: cover; margin-bottom: 20px; }
        .landing-info { text-align: center; margin-bottom: 30px; }
        .landing-info h1 { font-size: 24px; margin-bottom: 10px; color: #111; }
        .landing-info p { font-size: 14px; color: #555; margin-bottom: 5px; }
        .password-box { display: flex; align-items: center; gap: 10px; }
        .password-box span { font-size: 14px; color: #333; }
        .password-box input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; outline: none; font-size: 14px; }
        .password-box button { padding: 8px 16px; background: var(--theme-color); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }

        /* 2. 页眉与导航 */
        header { height: 60px; background: var(--theme-color); display: flex; align-items: center; padding: 0 20px; position: sticky; top: 0; z-index: 50; }
        .nav-toggle-btn { background: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; color: #333; }
        #side-nav { position: fixed; top: 60px; left: -250px; width: 250px; height: calc(100% - 60px); background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); z-index: 40; transition: left 0.3s ease; display: flex; flex-direction: column; padding-top: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        #side-nav.open { left: 0; }
        .nav-profile { display: flex; align-items: center; gap: 10px; padding: 0 20px 20px; border-bottom: 1px solid #eee; margin-bottom: 10px; }
        .nav-profile img { width: 40px; height: 40px; object-fit: cover; }
        .nav-profile span { font-size: 16px; font-weight: bold; color: #333; }
        .nav-item { padding: 12px 20px; font-size: 15px; color: #555; cursor: pointer; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--theme-color); color: #fff; }

        /* 3. 内容区域 */
        main { flex: 1; padding: 30px 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .page-section { display: none; animation: fadeIn 0.5s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .page-header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .page-header img { width: 60px; height: 60px; object-fit: cover; }
        .page-header h2 { font-size: 22px; color: #111; }
        .blog-card { background: rgba(255,255,255,0.9); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .blog-date { font-size: 12px; color: #888; margin-bottom: 10px; }
        .blog-content { font-size: 15px; line-height: 1.8; color: #333; white-space: pre-wrap; }
        .date-search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        .date-search-box input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        .date-search-box button { padding: 10px 20px; background: var(--theme-color); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .about-text-bubble { background: rgba(255,255,255,0.95); padding: 25px; border-radius: 16px; font-size: 15px; line-height: 2; color: #333; white-space: pre-wrap; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .photo-group { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .photo-group-title { background: var(--theme-color); color: #fff; font-size: 12px; padding: 6px 12px; border-radius: 20px; display: inline-block; margin-bottom: 12px; }
        .photo-group-images { display: flex; flex-direction: column; gap: 10px; }
        .photo-group-images img { width: 100%; border-radius: 10px; object-fit: cover; aspect-ratio: 4/3; }
        .photo-group-bottom { grid-column: span 2; }

        /* 4. 页脚与Tips */
        footer { background: #f0f0f0; padding: 20px; text-align: center; font-size: 13px; color: #888; margin-top: auto; position: relative; z-index: 10; }

        /* 5. 点赞特效 */
        .like-btn { position: fixed; bottom: 100px; right: 30px; display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 30; }
        .like-btn img { width: 40px; height: 40px; transition: transform 0.2s; }
        .like-btn span { font-size: 11px; color: #888; margin-top: 5px; }
        .like-btn:active img { transform: scale(1.2); }
        .like-effect { position: fixed; pointer-events: none; z-index: 31; animation: floatUp 1s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.5); } }
        .hidden { display: none !important; }

        @media (max-width: 600px) { .photo-grid { grid-template-columns: 1fr; } .photo-group-bottom { grid-column: span 1; } }
    </style>
</head>
<body>
    <div id="bg-layer"></div>

    <div id="landing-page">
        <img id="landing-avatar" class="landing-avatar" src="" alt="Avatar">
        <div class="landing-info">
            <h1>senako</h1>
            <p id="landing-intro"></p>
            <p id="landing-signature" style="font-style: italic; color: #888;"></p>
        </div>
        <div class="password-box">
            <span>请输入密码</span>
            <input type="password" id="password-input" placeholder="...">
            <button onclick="handleLogin()">进入</button>
        </div>
    </div>

    <header class="hidden" id="main-header">
        <button class="nav-toggle-btn" onclick="toggleNav()">Menu</button>
    </header>

    <nav id="side-nav">
        <div class="nav-profile">
            <img id="nav-avatar" src="" alt="Nav Avatar">
            <span>senako</span>
        </div>
        <div class="nav-item active" onclick="switchPage('home', this)">senako碎碎念</div>
        <div class="nav-item" onclick="switchPage('date', this)">日期</div>
        <div class="nav-item" onclick="switchPage('secret', this)">ヒミツ</div>
        <div class="nav-item" onclick="switchPage('about', this)">关于senako</div>
    </nav>

    <main class="hidden" id="main-content">
        <section id="page-home" class="page-section active">
            <div class="page-header">
                <img id="home-avatar" src="" alt="Home Avatar">
                <h2>senako碎碎念</h2>
            </div>
            <div id="blog-list"></div>
        </section>
        <section id="page-date" class="page-section">
            <h2 style="margin-bottom: 20px;">日期查找</h2>
            <div class="date-search-box">
                <input type="date" id="date-input">
                <button onclick="searchByDate()">搜索</button>
            </div>
            <div id="date-result-list"></div>
        </section>
        <section id="page-secret" class="page-section">
            <div id="secret-lock" style="text-align: center; margin-top: 50px;">
                <p style="margin-bottom: 15px; color: #555;">这是一个加密板块</p>
                <div class="password-box" style="justify-content: center;">
                    <input type="password" id="secret-password-input" placeholder="ヒミツ密码">
                    <button onclick="unlockSecret()">解锁</button>
                </div>
            </div>
            <div id="secret-content" class="hidden"></div>
        </section>
        <section id="page-about" class="page-section">
            <h2 style="margin-bottom: 20px;">关于senako</h2>
            <div id="about-text-box" class="about-text-bubble"></div>
            <div class="photo-grid">
                <div class="photo-group">
                    <div class="photo-group-title" id="photo-title-left"></div>
                    <div class="photo-group-images" id="photo-images-left"></div>
                </div>
                <div class="photo-group">
                    <div class="photo-group-title" id="photo-title-right"></div>
                    <div class="photo-group-images" id="photo-images-right"></div>
                </div>
                <div class="photo-group photo-group-bottom">
                    <div class="photo-group-title" id="photo-title-bottom"></div>
                    <div class="photo-group-images" id="photo-images-bottom"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="hidden" id="main-footer">
        <span id="tips-display">tips：加载中...</span>
    </footer>

    <div class="like-btn hidden" id="like-btn" onclick="triggerLike(event)">
        <img id="like-icon" src="" alt="Like">
        <span>click senakovo！</span>
    </div>

<script>
    // ==========================================
    // 👇 【配置区】请在这里修改你的所有个性化设置
    // ==========================================
    const CONFIG = {
        ADMIN_PASSWORD: "00998877",
        VISITOR_PASSWORD: "senako",
        SECRET_PASSWORD: "himitsu271",
        AVATAR_URL: "avatar.png",
        SIGNATURE: "啊哈哈哈哈哈哈哈哈哈",
        INTRO_TEXT: "这里senako。",
        ABOUT_TEXT: "这里senako。\n\n可扩：1916752887\n成分：pjsk|术力口|三无Marblue|maimai|phi|推理 \n推：knd|miku|三无|milk|俊达萌\n产品：玄中 \n日常：画画|看推理|打音游|写歌|解谜\n拒：25时一切相关|大众雷|术萌|负能",
        PHOTO_LEFT: { title: "oc/自设", images: ["photo-l1.jpg", "photo-l2.jpg"] },
        PHOTO_RIGHT: { title: "我推/我产", images: ["photo-r1.jpg", "photo-r2.jpg"] },
        PHOTO_BOTTOM: { title: "作品", images: ["photo-b1.jpg", "photo-b2.jpg", "photo-b3.jpg"] },
        HOME_BG: { url: "bg-home.jpg", opacity: 0.3 },
        DATE_BG: { url: "bg-date.jpg", opacity: 0.3 },
        SECRET_BG: { url: "bg-secret.jpg", opacity: 0.3 },
        ABOUT_BG: { url: "bg-about.jpg", opacity: 0.3 },
        LANDING_BG: { url: "bg-landing.jpg", opacity: 0.3 },
        LIKE_ICON_URL: "like-icon.png",
        LIKE_EFFECT_URL: "like-effect.png",
        TIPS_ARRAY: [
            "这是一条tips",
            "多喝热水~",
            "刷新网页会出现新的tips哦。",
            "刷新网页会出现新的tips哦。",
            "早安，午安，晚安。",
            "想不出来tips了可恶。",
 "DIVELA是神。",
 "天丛云是神。",
 "嘿嘿嘿嘿嘿嘿嘿嘿嘿嘿嘿嘿嘿嘿嘿嘿",
 "冷知识：senako制作这个网站牺牲了一晚上睡眠。",
 "喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵喵",
 "生日快乐！",
 "新年快乐！",
 "感觉椰子好傻你锤它它只会咕噜咕噜地往前滚。",
 "上班吃外卖真的很不健康，建议大家不要上班。",
 "无人扶我青云志，我自己也上不去。",
 "对立像条飞龙一样往前移动。",
 "喵喵，咕噜咕噜",
 "要开始了哟~",
 "请不要大力拍打或滑动哟~",
"子在川上曰：逝者如斯夫。子在川下曰：咕噜咕噜咕噜。",
"up↑side↓up↑side↓down↓up↑side↓down↓side↓up↑and↓down↓",
"左边，右边，露出尖尖的牙齿，啪啪啪，哈哈你是王。",
"刷新网页会出现新的tips哦。",
"刷新网页会出现新的tips哦。",
"*(一阵劲爆的电吉他)",
"x x xxx",
"感谢千问对senako网站的大力支持。",
"刷新网页会出现新的tips哦。",

        ],
        BLOGS: [
            { date: "2026-08-22", content: "1：31了哈哈写到这个点了困得不行。", type: "normal" },
            { date: "2026-08-21", content: "太邪恶了这个网站。", type: "normal" },
            { date: "2026-08-20", content: "和代码斗智斗勇一晚上的产物。", type: "normal" },
            { date: "2026-08-19", content: "恭喜你发现这里。", type: "secret" }
        ]
    };
    // ==========================================
    // 👆 【配置区】结束，下面的代码不需要修改
    // ==========================================

    let currentUserRole = null;

    // 初始化页面元素（头像、博客列表、照片组、Tips等）
    function initElements() {
        document.getElementById('landing-avatar').src = CONFIG.AVATAR_URL;
        document.getElementById('nav-avatar').src = CONFIG.AVATAR_URL;
        document.getElementById('home-avatar').src = CONFIG.AVATAR_URL;
        document.getElementById('like-icon').src = CONFIG.LIKE_ICON_URL;
        document.getElementById('landing-intro').innerText = CONFIG.INTRO_TEXT;
        document.getElementById('landing-signature').innerText = CONFIG.SIGNATURE;
        document.getElementById('about-text-box').innerText = CONFIG.ABOUT_TEXT;
        renderPhotoGroup('left', CONFIG.PHOTO_LEFT);
        renderPhotoGroup('right', CONFIG.PHOTO_RIGHT);
        renderPhotoGroup('bottom', CONFIG.PHOTO_BOTTOM);
        renderBlogs(CONFIG.BLOGS.filter(b => b.type === 'normal'), 'blog-list');
        refreshTips();
    }

    // 渲染照片组
    function renderPhotoGroup(position, config) {
        const titleEl = document.getElementById('photo-title-' + position);
        const imagesEl = document.getElementById('photo-images-' + position);
        titleEl.innerText = config.title;
        imagesEl.innerHTML = '';
        config.images.forEach(imgSrc => {
            const img = document.createElement('img');
            img.src = imgSrc;
            img.alt = config.title;
            imagesEl.appendChild(img);
        });
    }

    // 处理登录逻辑（同时记住登录状态）
    function handleLogin() {
        const pwd = document.getElementById('password-input').value;
        if (pwd === CONFIG.ADMIN_PASSWORD) {
            currentUserRole = 'admin';
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('currentPage', 'home');
            enterBlog();
        } else if (pwd === CONFIG.VISITOR_PASSWORD) {
            currentUserRole = 'visitor';
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('currentPage', 'home');
            enterBlog();
        } else {
            alert("密码错误，请重新输入！");
        }
    }

    // 进入博客（隐藏密码页，显示主内容）
    function enterBlog() {
        document.getElementById('landing-page').classList.add('hidden');
        document.getElementById('main-header').classList.remove('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        document.getElementById('main-footer').classList.remove('hidden');
        document.getElementById('like-btn').classList.remove('hidden');
        updateBackground(CONFIG.LANDING_BG);
    }

    // 切换页面（同时记住当前页面）
    function switchPage(page, navItem) {
        sessionStorage.setItem('currentPage', page);
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if (navItem) navItem.classList.add('active');
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        switch(page) {
            case 'home': updateBackground(CONFIG.HOME_BG); break;
            case 'date': updateBackground(CONFIG.DATE_BG); break;
            case 'secret': updateBackground(CONFIG.SECRET_BG); break;
            case 'about': updateBackground(CONFIG.ABOUT_BG); break;
        }
        refreshTips();
        document.getElementById('side-nav').classList.remove('open');
    }

    // 更新背景
    function updateBackground(bgConfig) {
        const bgLayer = document.getElementById('bg-layer');
        bgLayer.style.backgroundImage = "url('" + bgConfig.url + "')";
        bgLayer.style.opacity = bgConfig.opacity;
    }

    // 渲染博客卡片
    function renderBlogs(blogs, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        if (blogs.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #888; margin-top: 30px;">没有找到相关博客哦~</p>';
            return;
        }
        blogs.forEach(blog => {
            const card = document.createElement('div');
            card.className = 'blog-card';
            card.innerHTML = '<div class="blog-date">' + blog.date + '</div><div class="blog-content">' + blog.content + '</div>';
            container.appendChild(card);
        });
    }

    // 按日期搜索博客
    function searchByDate() {
        const dateVal = document.getElementById('date-input').value;
        const filtered = CONFIG.BLOGS.filter(b => b.date === dateVal && b.type === 'normal');
        renderBlogs(filtered, 'date-result-list');
    }

    // 解锁加密板块
    function unlockSecret() {
        const pwd = document.getElementById('secret-password-input').value;
        if (pwd === CONFIG.SECRET_PASSWORD || currentUserRole === 'admin') {
            document.getElementById('secret-lock').classList.add('hidden');
            const secretBlogs = CONFIG.BLOGS.filter(b => b.type === 'secret');
            renderBlogs(secretBlogs, 'secret-content');
            document.getElementById('secret-content').classList.remove('hidden');
        } else {
            alert("密码错误！");
        }
    }

    // 随机刷新Tips
    function refreshTips() {
        const tips = CONFIG.TIPS_ARRAY;
        const randomTip = tips[Math.floor(Math.random() * tips.length)];
        document.getElementById('tips-display').innerText = "tips：" + randomTip;
    }

    // 切换侧边导航
    function toggleNav() {
        document.getElementById('side-nav').classList.toggle('open');
    }

    // 点赞特效
    function triggerLike(event) {
        const effect = document.createElement('div');
        effect.className = 'like-effect';
        effect.innerHTML = '<img src="' + CONFIG.LIKE_EFFECT_URL + '" style="width:30px;height:30px;">';
        effect.style.left = event.clientX - 15 + 'px';
        effect.style.top = event.clientY - 15 + 'px';
        document.body.appendChild(effect);
        setTimeout(() => effect.remove(), 1000);
    }

    // ==========================================
    // 页面加载时：检查是否已经登录，记住页面状态
    // ==========================================
    window.onload = function() {
        // 先初始化所有页面元素（头像、博客列表、照片、Tips等）
        initElements();

        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            // 已经登录过 → 直接进入博客，并恢复到上次停留的页面
            enterBlog();
            const lastPage = sessionStorage.getItem('currentPage') || 'home';
            switchPage(lastPage, document.querySelector('.nav-item[onclick*="' + lastPage + '"]'));
        } else {
            // 没登录过 → 显示密码页（initElements 已经初始化了密码页的头像等信息）
        }
    };
</script>
</body>
</html>
