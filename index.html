    width: 460px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* 加点阴影 */
    margin-top: -80px; /* 👈 关键！把整个框往上提，头像就露出来一半了 */
}

        /* 2. 页眉与导航 */

    // 初始化页面元素（头像、博客列表、照片组、Tips等）
    function initElements() {
        document.getElementById('landing-avatar').src = CONFIG.AVATAR_URL;

        document.getElementById('landing-signature').innerText = CONFIG.SIGNATURE;
        document.getElementById('about-text-box').innerText = CONFIG.ABOUT_TEXT;
        renderPhotoGroup('left', CONFIG.PHOTO_LEFT);
        renderPhotoGroup('right', CONFIG.PHOTO_RIGHT);
        renderPhotoGroup('bottom', CONFIG.PHOTO_BOTTOM);
        renderBlogs(CONFIG.BLOGS.filter(b => b.type === 'normal'), 'blog-list');
        refreshTips();
    }

    // 渲染照片组
    function renderPhotoGroup(position, config) {
        const titleEl = document.getElementById('photo-title-' + position);
        const imagesEl = document.getElementById('photo-images-' + position);
        titleEl.innerText = config.title;
        imagesEl.innerHTML = '';
        config.images.forEach(imgSrc => {
            const img = document.createElement('img');
            img.src = imgSrc;
            img.alt = config.title;
            imagesEl.appendChild(img);
        });
    }

    // 处理登录逻辑（同时记住登录状态）
    function handleLogin() {
        const pwd = document.getElementById('password-input').value;
        if (pwd === CONFIG.ADMIN_PASSWORD) {
            currentUserRole = 'admin';
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('currentPage', 'home');
            enterBlog();
        } else if (pwd === CONFIG.VISITOR_PASSWORD) {
            currentUserRole = 'visitor';
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('currentPage', 'home');
            enterBlog();
        } else {
            alert("密码错误，请重新输入！");
        }
    }

    // 进入博客（隐藏密码页，显示主内容）
    function enterBlog() {
        document.getElementById('landing-page').classList.add('hidden');
        document.getElementById('main-header').classList.remove('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        document.getElementById('main-footer').classList.remove('hidden');
        document.getElementById('like-btn').classList.remove('hidden');
        updateBackground(CONFIG.LANDING_BG);
    }

    // 切换页面（同时记住当前页面）
    function switchPage(page, navItem) {
        sessionStorage.setItem('currentPage', page);
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if (navItem) navItem.classList.add('active');
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        switch(page) {
            case 'home': updateBackground(CONFIG.HOME_BG); break;
            case 'date': updateBackground(CONFIG.DATE_BG); break;
            case 'secret': updateBackground(CONFIG.SECRET_BG); break;
            case 'about': updateBackground(CONFIG.ABOUT_BG); break;
        }
        refreshTips();
        document.getElementById('side-nav').classList.remove('open');
    }

    // 更新背景
    function updateBackground(bgConfig) {
        const bgLayer = document.getElementById('bg-layer');
        bgLayer.style.backgroundImage = "url('" + bgConfig.url + "')";
        bgLayer.style.opacity = bgConfig.opacity;
console.log('背景已更新为:', bgConfig.url);
    }

    // 渲染博客卡片
    function renderBlogs(blogs, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
 blogs.sort((a, b) => new Date(b.date) - new Date(a.date));
        if (blogs.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #888; margin-top: 30px;">没有找到相关博客哦~</p>';
            return;
        }
        blogs.forEach(blog => {
            const card = document.createElement('div');
            card.className = 'blog-card';
            
            // 1. 如果有封面图，就先显示图片
            let imgHtml = blog.img ? `<img src="${blog.img}" style="width: 100%; border-radius: 10px; margin-bottom: 15px;">` : '';
            
            // 2. 把文字里的 ![图片名](图片链接) 自动变成真正的图片
            let processedContent = blog.content.replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" style="width: 100%; border-radius: 10px; margin: 10px 0;">');
            
            card.innerHTML = `${imgHtml}<div class="blog-date">${blog.date}</div><div class="blog-content">${processedContent}</div>`;
            container.appendChild(card);
        });
    }

        // 日期查找功能
        function searchByDate() {
            const dateVal = document.getElementById('date-input').value;
            const filtered = CONFIG.BLOGS.filter(b => b.date === dateVal && b.type === 'normal');
            renderBlogs(filtered, 'date-result-list');
        }

        // 关键词搜索功能
        function searchByKeyword() {
            const keyword = document.getElementById('keyword-input').value.trim().toLowerCase();
            if (!keyword) {
                renderBlogs(CONFIG.BLOGS, 'date-result-list');
                return;
            }
            const filteredBlogs = CONFIG.BLOGS.filter(blog => 
                blog.content.toLowerCase().includes(keyword)
            );
            renderBlogs(filteredBlogs, 'date-result-list');
        }

    // 解锁加密板块
    function unlockSecret() {
        const pwd = document.getElementById('secret-password-input').value;
        if (pwd === CONFIG.SECRET_PASSWORD || currentUserRole === 'admin') {
            document.getElementById('secret-lock').classList.add('hidden');
            const secretBlogs = CONFIG.BLOGS.filter(b => b.type === 'secret');
            renderBlogs(secretBlogs, 'secret-content');
            document.getElementById('secret-content').classList.remove('hidden');
        } else {
            alert("密码错误！");
        }
    }

    // 随机刷新Tips
    function refreshTips() {
        const tips = CONFIG.TIPS_ARRAY;
        const randomTip = tips[Math.floor(Math.random() * tips.length)];
        document.getElementById('tips-display').innerText = "tips：" + randomTip;
    }

    // 切换侧边导航
    function toggleNav() {
        document.getElementById('side-nav').classList.toggle('open');
    }

    // 点赞特效
    function triggerLike(event) {
        const effect = document.createElement('div');
        effect.className = 'like-effect';
        effect.innerHTML = '<img src="' + CONFIG.LIKE_EFFECT_URL + '" style="width:30px;height:30px;">';
        effect.style.left = event.clientX - 15 + 'px';
        effect.style.top = event.clientY - 15 + 'px';
        document.body.appendChild(effect);
        setTimeout(() => effect.remove(), 1000);
    }

    // ==========================================
    // 页面加载时：检查是否已经登录，记住页面状态
    // ==========================================
    window.onload = function() {
        // 先初始化所有页面元素（头像、博客列表、照片、Tips等）
        initElements();
    updateBackground(CONFIG.LANDING_BG);

        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            // 已经登录过 → 直接进入博客，并恢复到上次停留的页面
            enterBlog();
            const lastPage = sessionStorage.getItem('currentPage') || 'home';
            switchPage(lastPage, document.querySelector('.nav-item[onclick*="' + lastPage + '"]'));
        } else {
            // 没登录过 → 显示密码页（initElements 已经初始化了密码页的头像等信息）
        }
    };
</script>
</body>
</html>
